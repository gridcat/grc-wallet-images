name: Build & publish wallet images

# Builds gridcoinresearchd-based wallet container images and mirrors
# them to BOTH ghcr.io and Docker Hub. Each image bundles the latest
# published gridcoinresearch-tui release, passed in as the
# TUI_VERSION build-arg.
#
# Mainnet and testnet ship on independent version timelines. Push
# `mainnet-v0.2.0` to bump only mainnet; `testnet-v0.5.3` to bump only
# testnet. Bumping both at once is two tag pushes — minor friction in
# exchange for the testnet daemon pin not forcing a no-op mainnet
# rebuild every time the testnet PPA cuts a new version.
#
# Triggers:
#   - push tag `mainnet-v*` → build mainnet only, publish `:<vX.Y.Z>`
#                             and `:latest` to both registries, sync
#                             this README to the Docker Hub repo
#                             description, and stamp the published
#                             manifest digest on the Gridcoin chain.
#                             Testnet job is skipped.
#   - push tag `testnet-v*` → same shape, testnet flavour only
#                             (`:<vX.Y.Z>-testnet` + `:latest-testnet`).
#                             Mainnet job is skipped.
#   - weekly schedule → republish BOTH `:latest` flavours so a new
#                       TUI / PPA release flows in without an explicit
#                       tag. No stamp, no README re-sync.
#   - workflow_dispatch → on a branch: same as weekly. On a
#                       `mainnet-v*` / `testnet-v*` tag: same as that tag
#                       push. check-daemon.yml dispatches on the tag it
#                       creates, because a tag pushed with GITHUB_TOKEN
#                       doesn't trigger this workflow by itself.
#
# Every build also publishes `:v<daemon>-tui<tui>` (e.g.
# `:v5.5.1.0-83-tui1.13.1`), so the registry tag list shows what
# `:latest` contains. The TUI is the latest plain vX.Y.Z release,
# resolved here and passed in as the TUI_VERSION build-arg.
#
# Secrets the repo must have:
#   - DOCKERHUB_USERNAME — Docker Hub login (gridcat).
#   - DOCKERHUB_TOKEN    — Docker Hub PAT with read/write/delete
#                          on gridcat/grc-wallet.
# GHCR auth uses GITHUB_TOKEN automatically — no separate setup.

on:
  push:
    tags:
      - 'mainnet-v*'
      - 'testnet-v*'
  schedule:
    # Sundays 03:00 UTC. Picks up new TUI/PPA without a manual tag.
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build_mainnet:
    name: Build & publish mainnet
    runs-on: ubuntu-latest
    # Tag refs (push or dispatch) build only their own network; branch
    # runs (schedule, manual) rebuild both flavours.
    if: "!startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/tags/mainnet-v')"
    # One publish per network at a time, so runs can't finish out of
    # order. GitHub cancels a queued run when a newer one queues;
    # check-daemon.yml re-dispatches any release tag left without images.
    concurrency:
      group: publish-mainnet
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # Only a build of what master holds now moves :latest, so a
      # re-dispatched older tag or an older queued run can't roll it back.
      - name: Check this build is current
        id: fresh
        run: |
          git fetch -q --depth=1 origin master
          if [ "$(git rev-parse HEAD:mainnet)" = "$(git rev-parse FETCH_HEAD:mainnet)" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::mainnet/ changed on master since this run started; not moving :latest"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve bundled versions
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERFILE: ./mainnet/Dockerfile
        run: |
          daemon=$(grep -oP '^ARG GRC_DAEMON_VERSION=\K\S+' "$DOCKERFILE")
          tui=$(gh api repos/gridcat/gridcoinresearch-tui/releases/latest --jq .tag_name)
          if [ -z "$daemon" ] || ! [[ "$tui" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: could not resolve versions (daemon='$daemon', tui='$tui')"
            exit 1
          fi
          # Docker tags can't contain `~`: drop the Ubuntu build suffix.
          combo="v${daemon%%~*}-tui${tui#v}"
          echo "tui=$tui" >> "$GITHUB_OUTPUT"
          echo "combo=$combo" >> "$GITHUB_OUTPUT"
          {
            echo "### mainnet image"
            echo "| component | version |"
            echo "|---|---|"
            echo "| daemon | \`$daemon\` |"
            echo "| gridcoinresearch-tui | \`$tui\` |"
            echo "| image tag | \`$combo\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ghcr.io/gridcat/grc-wallet
            gridcat/grc-wallet
          # type=match strips the `mainnet-` prefix so the published
          # tag is `:vX.Y.Z`, not `:mainnet-vX.Y.Z`. The raw `:latest`
          # always applies (tag push, schedule, and manual all want
          # `:latest` to track the most recent build).
          # latest=false: metadata-action would otherwise add :latest for
          # every type=match tag, bypassing the freshness check.
          flavor: |
            latest=false
          tags: |
            type=match,pattern=mainnet-(v.*),group=1
            type=raw,value=${{ steps.ver.outputs.combo }}
            type=raw,value=latest,enable=${{ steps.fresh.outputs.current }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ./mainnet
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: TUI_VERSION=${{ steps.ver.outputs.tui }}

      - name: Stamp mainnet image digest on Gridcoin
        if: startsWith(github.ref, 'refs/tags/mainnet-v')
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          HASH="${DIGEST#sha256:}"
          echo "Stamping mainnet image @ $DIGEST"
          curl -fsS -X POST https://stamp.gridcoin.club/api/stamps \
            -H 'Content-Type: application/json' \
            -d "{\"data\":{\"type\":\"stamps\",\"attributes\":{\"hash\":\"${HASH}\",\"hashType\":\"sha256\"}}}" \
            || echo "stamp POST failed (non-fatal)"

      # Sync this README + short description to the Docker Hub
      # repository page. Only on mainnet tag push — the README is
      # network-agnostic, so a single sync covers both flavours, and
      # gating on mainnet-v* keeps weekly :latest republishes from
      # touching the Hub description.
      - name: Sync README to Docker Hub
        if: startsWith(github.ref, 'refs/tags/mainnet-v')
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: gridcat/grc-wallet
          short-description: "Gridcoin wallet daemon (mainnet + testnet) with bundled gridcoinresearch-tui. Built and stamped on-chain by gridcoin.club."
          readme-filepath: ./README.md

  build_testnet:
    name: Build & publish testnet
    runs-on: ubuntu-latest
    if: "!startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/tags/testnet-v')"
    # One publish per network at a time, so runs can't finish out of
    # order. GitHub cancels a queued run when a newer one queues;
    # check-daemon.yml re-dispatches any release tag left without images.
    concurrency:
      group: publish-testnet
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # Only a build of what master holds now moves :latest, so a
      # re-dispatched older tag or an older queued run can't roll it back.
      - name: Check this build is current
        id: fresh
        run: |
          git fetch -q --depth=1 origin master
          if [ "$(git rev-parse HEAD:testnet)" = "$(git rev-parse FETCH_HEAD:testnet)" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::testnet/ changed on master since this run started; not moving :latest"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve bundled versions
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERFILE: ./testnet/Dockerfile
        run: |
          daemon=$(grep -oP '^ARG GRC_DAEMON_VERSION=\K\S+' "$DOCKERFILE")
          tui=$(gh api repos/gridcat/gridcoinresearch-tui/releases/latest --jq .tag_name)
          if [ -z "$daemon" ] || ! [[ "$tui" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: could not resolve versions (daemon='$daemon', tui='$tui')"
            exit 1
          fi
          # Docker tags can't contain `~`: drop the Ubuntu build suffix.
          combo="v${daemon%%~*}-tui${tui#v}"
          echo "tui=$tui" >> "$GITHUB_OUTPUT"
          echo "combo=$combo" >> "$GITHUB_OUTPUT"
          {
            echo "### testnet image"
            echo "| component | version |"
            echo "|---|---|"
            echo "| daemon | \`$daemon\` |"
            echo "| gridcoinresearch-tui | \`$tui\` |"
            echo "| image tag | \`$combo\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ghcr.io/gridcat/grc-wallet
            gridcat/grc-wallet
          # Suffix the testnet flavour. With `onlatest=true` the suffix
          # is also applied to `:latest`, so the published tags become
          # `:<vX.Y.Z>-testnet` and `:latest-testnet`. type=match strips
          # the `testnet-` prefix from the source tag the same way
          # mainnet does.
          flavor: |
            latest=false
            suffix=-testnet,onlatest=true
          tags: |
            type=match,pattern=testnet-(v.*),group=1
            type=raw,value=${{ steps.ver.outputs.combo }}
            type=raw,value=latest,enable=${{ steps.fresh.outputs.current }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ./testnet
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: TUI_VERSION=${{ steps.ver.outputs.tui }}

      - name: Stamp testnet image digest on Gridcoin
        if: startsWith(github.ref, 'refs/tags/testnet-v')
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          HASH="${DIGEST#sha256:}"
          echo "Stamping testnet image @ $DIGEST"
          curl -fsS -X POST https://stamp.gridcoin.club/api/stamps \
            -H 'Content-Type: application/json' \
            -d "{\"data\":{\"type\":\"stamps\",\"attributes\":{\"hash\":\"${HASH}\",\"hashType\":\"sha256\"}}}" \
            || echo "stamp POST failed (non-fatal)"
